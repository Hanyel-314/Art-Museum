<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Art Museum</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <h1>Interactive Art Museum</h1>
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
            <p class="loading-text">Loading experience...</p>
        </div>
    </div>

    <!-- Main Canvas -->
    <canvas id="museum-canvas"></canvas>

    <!-- UI Overlay -->
    <div id="ui-overlay">
        <!-- Entrance Tooltip -->
        <div id="entrance-tooltip" class="tooltip hidden">
            Click to Enter Museum
        </div>

        <!-- Back Button -->
        <button id="back-button" class="nav-button hidden">
            <span class="back-arrow">←</span> Back
        </button>

        <!-- Artwork Info Panel -->
        <div id="artwork-info" class="info-panel hidden">
            <button class="close-btn" id="close-info">×</button>
            <h2 id="artwork-title"></h2>
            <p class="artwork-artist" id="artwork-artist"></p>
            <p class="artwork-year" id="artwork-year"></p>
            <p class="artwork-medium" id="artwork-medium"></p>
            <p class="artwork-description" id="artwork-description"></p>
            <div class="interaction-hint">
                <p>🖱️ Drag to rotate 360°</p>
                <p>🔍 Scroll to zoom</p>
            </div>
        </div>

        <!-- Wall Selection Hints -->
        <div id="wall-hint-left" class="wall-hint hidden">
            ← View Left Gallery
        </div>
        <div id="wall-hint-right" class="wall-hint hidden">
            View Right Gallery →
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="door-sound" preload="auto">
        <source src="assets/sounds/door-open.mp3" type="audio/mpeg">
    </audio>
    <audio id="ambient-sound" loop preload="auto">
        <source src="assets/sounds/museum-ambient.mp3" type="audio/mpeg">
    </audio>

    <script type="module" src="main.js"></script>
</body>
</html>
