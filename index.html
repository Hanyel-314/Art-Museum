<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Art Museum</title>

    <!-- Import map for Three.js CDN -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
    </script>

    <style>
        /* ============================================
           GLOBAL STYLES
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            overflow: hidden;
            background: #000;
        }

        #museum-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: default;
        }

        /* ============================================
           LOADING SCREEN
           ============================================ */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease-out;
        }

        #loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loading-content {
            text-align: center;
            color: #fff;
        }

        .loading-content h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            font-weight: 300;
            letter-spacing: 4px;
            font-family: 'Georgia', serif;
        }

        .loading-bar {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin: 0 auto;
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #d4af37, #f4e5c2);
            width: 100%;
            animation: loadProgress 1.5s ease-out;
        }

        @keyframes loadProgress {
            from { width: 0%; }
            to { width: 100%; }
        }

        .loading-text {
            margin-top: 1rem;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        /* ============================================
           UI OVERLAY
           ============================================ */
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .hidden {
            display: none !important;
        }

        /* Back Button */
        .nav-button {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 2px solid rgba(212, 175, 55, 0.6);
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            pointer-events: all;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            backdrop-filter: blur(10px);
        }

        .nav-button:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: #d4af37;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .back-arrow {
            font-size: 1.2rem;
        }

        /* Artwork Info Panel */
        .info-panel {
            position: absolute;
            top: 2rem;
            right: 2rem;
            width: 350px;
            max-height: 80vh;
            background: linear-gradient(135deg, rgba(20, 30, 48, 0.95), rgba(30, 40, 60, 0.95));
            color: #fff;
            padding: 2rem;
            border-radius: 12px;
            pointer-events: all;
            overflow-y: auto;
            border: 2px solid rgba(212, 175, 55, 0.5);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4), 0 8px 32px rgba(0, 0, 0, 0.8);
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .info-panel h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #FFD700;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .info-panel .artwork-artist {
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
            font-style: italic;
            opacity: 0.9;
        }

        .info-panel .artwork-year,
        .info-panel .artwork-medium {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 0.3rem;
        }

        .info-panel .artwork-description {
            margin-top: 1rem;
            line-height: 1.6;
            font-size: 0.95rem;
            opacity: 0.85;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.3s;
            pointer-events: all;
        }

        .close-btn:hover {
            opacity: 1;
        }

        .interaction-hint {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .interaction-hint p {
            font-size: 0.85rem;
            opacity: 0.6;
            margin: 0.3rem 0;
        }

        /* Wall Hints */
        .wall-hint {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            pointer-events: none;
            border: 2px solid rgba(212, 175, 55, 0.4);
            animation: fadeSlide 0.5s ease-out;
        }

        #wall-hint-left {
            left: 2rem;
        }

        #wall-hint-right {
            right: 2rem;
        }

        @keyframes fadeSlide {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Scrollbar Styling */
        .info-panel::-webkit-scrollbar {
            width: 6px;
        }

        .info-panel::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .info-panel::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.5);
            border-radius: 3px;
        }

        .info-panel::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 175, 55, 0.7);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .info-panel {
                width: calc(100% - 2rem);
                right: 1rem;
                top: 1rem;
                max-height: 60vh;
            }

            .nav-button {
                bottom: 1rem;
                left: 1rem;
            }
        }

        /* ============================================
           FULL-SCREEN DETAIL OVERLAY (PURE BLACK 2D)
           ============================================ */
        .detail-overlay {
            position: fixed;
            inset: 0;
            background: #000000;
            z-index: 2000;
            display: none; /* Hidden by default */
            align-items: center;
            justify-content: center;
        }

        .detail-overlay.active {
            display: flex;
        }

        .detail-content {
            display: flex;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            gap: 4rem;
            padding: 2rem;
        }

        /* Left Side: Framed Painting */
        .detail-painting-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
            max-width: none;
        }

        .painting-frame {
            position: relative;
            padding: 1.5rem;
            background: linear-gradient(135deg, #D4AF37 0%, #F4E5C2 50%, #D4AF37 100%);
            border-radius: 4px;
            box-shadow:
                0 0 0 3px #8B7355,
                0 0 30px rgba(212, 175, 55, 0.5),
                inset 0 0 20px rgba(139, 115, 85, 0.3);
            transform-style: preserve-3d;
            transition: transform 0.05s linear;
            cursor: grab;
        }

        .painting-frame:active {
            cursor: grabbing;
        }

        .painting-canvas {
            width: 40vw;
            max-width: 700px;
            min-width: 300px;
            height: auto;
            aspect-ratio: 1;
            max-height: 70vh;
            border: 2px solid #8B7355;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
        }

        /* Right Side: Info Panel */
        .detail-info-panel {
            position: relative;
            flex: 0 0 450px;
            max-width: 450px;
            background: linear-gradient(135deg, rgba(17, 24, 39, 0.95), rgba(31, 41, 55, 0.95));
            border: 2px solid rgba(212, 175, 55, 0.6);
            border-radius: 12px;
            padding: 2.5rem;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow:
                0 0 40px rgba(212, 175, 55, 0.4),
                0 10px 50px rgba(0, 0, 0, 0.8);
        }

        .detail-close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            opacity: 0.7;
            transition: all 0.3s;
            line-height: 1;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .detail-close-btn:hover {
            opacity: 1;
            color: #FFD700;
            transform: scale(1.1);
        }

        .detail-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #FFD700;
            font-weight: 600;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            line-height: 1.2;
            padding-right: 2rem;
        }

        .detail-artist {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            font-style: italic;
            opacity: 0.95;
            color: #E5E7EB;
        }

        .detail-year,
        .detail-medium {
            font-size: 1rem;
            opacity: 0.75;
            margin-bottom: 0.4rem;
            color: #D1D5DB;
        }

        .detail-description {
            margin-top: 1.5rem;
            line-height: 1.8;
            font-size: 1.05rem;
            opacity: 0.9;
            color: #E5E7EB;
        }

        .detail-interaction-hint {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-interaction-hint p {
            font-size: 0.9rem;
            opacity: 0.6;
            margin: 0.3rem 0;
            color: #D1D5DB;
        }

        /* Responsive for Detail Overlay */
        @media (max-width: 1024px) {
            .detail-content {
                flex-direction: column;
                gap: 2rem;
                overflow-y: auto;
            }

            .detail-painting-container {
                max-width: 500px;
            }

            .painting-canvas {
                width: 350px;
                height: 350px;
            }

            .detail-info-panel {
                flex: 0 0 auto;
                max-width: 500px;
                width: 100%;
            }
        }

        @media (max-width: 768px) {
            .painting-canvas {
                width: 300px;
                height: 300px;
            }

            .detail-title {
                font-size: 2rem;
            }

            .detail-artist {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <h1>ART MUSEUM</h1>
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
            <p class="loading-text">Preparing your experience...</p>
        </div>
    </div>

    <!-- Main Canvas -->
    <canvas id="museum-canvas"></canvas>

    <!-- UI Overlay -->
    <div id="ui-overlay">
        <!-- Back Button -->
        <button id="back-button" class="nav-button hidden">
            <span class="back-arrow">←</span> <span id="back-text">Back</span>
        </button>

        <!-- Artwork Info Panel (OLD - keeping for compatibility) -->
        <div id="artwork-info" class="info-panel hidden">
            <button class="close-btn" id="close-info">×</button>
            <h2 id="artwork-title"></h2>
            <p class="artwork-artist" id="artwork-artist"></p>
            <p class="artwork-year" id="artwork-year"></p>
            <p class="artwork-medium" id="artwork-medium"></p>
            <p class="artwork-description" id="artwork-description"></p>
            <div class="interaction-hint">
                <p>🖱️ Drag to rotate 360°</p>
                <p>🔍 Scroll to zoom</p>
            </div>
        </div>

        <!-- Wall Selection Hints -->
        <div id="wall-hint-left" class="wall-hint hidden">
            ← View Left Gallery
        </div>
        <div id="wall-hint-right" class="wall-hint hidden">
            View Right Gallery →
        </div>
    </div>

    <!-- Full-Screen Detail Overlay (Pure Black 2D View) -->
    <div id="detail-overlay" class="detail-overlay">
        <div class="detail-content">
            <!-- Left Side: Framed Painting -->
            <div class="detail-painting-container">
                <div class="painting-frame">
                    <div id="detail-painting" class="painting-canvas"></div>
                </div>
            </div>

            <!-- Right Side: Info Panel -->
            <div class="detail-info-panel">
                <button class="detail-close-btn" id="detail-close">×</button>
                <h2 id="detail-title" class="detail-title"></h2>
                <p id="detail-artist" class="detail-artist"></p>
                <p id="detail-year" class="detail-year"></p>
                <p id="detail-medium" class="detail-medium"></p>
                <p id="detail-description" class="detail-description"></p>
                <div class="detail-interaction-hint">
                    <p>Drag to rotate • Scroll to zoom</p>
                    <p>Press ESC or click × to return to gallery</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // ============================================
        // INTERACTIVE ART MUSEUM - COMPLETE VERSION
        // ============================================

        import * as THREE from 'three';

        console.log('🎨 Art Museum Initializing...');

        // ============================================
        // STATE MACHINE & GLOBAL STATE
        // ============================================

        let scene, camera, renderer;
        let currentView = 'ENTRANCE'; // ENTRANCE, CORRIDOR, WALL_LEFT, WALL_RIGHT, DETAIL
        let isAnimating = false;
        let selectedPainting = null;

        // Scene Objects
        let entranceDoor, leftDoorPanel, rightDoorPanel;
        let corridorGroup = [];
        let leftWallPaintings = [];
        let rightWallPaintings = [];
        let detailArtwork = null;
        let hoveredPainting = null;

        // Interaction
        let raycaster, mouse;
        let isDragging = false;
        let previousMouse = { x: 0, y: 0 };

        // Lighting
        let detailKeyLight, detailRimLight, detailFillLight;

        // UI Elements
        const backBtn = document.getElementById('back-button');
        const backText = document.getElementById('back-text');
        const infoPanel = document.getElementById('artwork-info');
        const wallHintLeft = document.getElementById('wall-hint-left');
        const wallHintRight = document.getElementById('wall-hint-right');

        // Detail Overlay Elements
        const detailOverlay = document.getElementById('detail-overlay');
        const detailPainting = document.getElementById('detail-painting');
        const detailCloseBtn = document.getElementById('detail-close');
        const detailTitle = document.getElementById('detail-title');
        const detailArtist = document.getElementById('detail-artist');
        const detailYear = document.getElementById('detail-year');
        const detailMedium = document.getElementById('detail-medium');
        const detailDescription = document.getElementById('detail-description');

        // ============================================
        // ARTWORK DATA
        // ============================================

        const ARTWORKS = {
            left: [
                {
                    title: "The Starry Night",
                    artist: "Vincent van Gogh",
                    year: "1889",
                    medium: "Oil on canvas",
                    description: "Painted during van Gogh's stay at the Saint-Paul-de-Mausole asylum in Saint-Rémy-de-Provence, this iconic masterpiece depicts a swirling, turbulent night sky filled with luminous stars and a crescent moon hovering over a sleeping village. The bold, expressive brushstrokes create a sense of movement and emotional intensity, with deep blues and vibrant yellows contrasting to evoke both tranquility and inner turmoil. The cypress tree in the foreground reaches upward like a dark flame, symbolizing the connection between earth and sky, life and death. Van Gogh's revolutionary use of impasto technique and his ability to convey profound emotion through color and form have made this work one of the most recognized and celebrated paintings in art history, influencing generations of expressionist and modern artists.",
                    color: 0x2B4C7E
                },
                {
                    title: "The Scream",
                    artist: "Edvard Munch",
                    year: "1893",
                    medium: "Oil, tempera, pastel and crayon on cardboard",
                    description: "This powerful expressionist icon captures a moment of existential dread and psychological anguish that resonates universally across cultures and time periods. The central figure stands on a bridge, hands pressed against its face in a gesture of overwhelming anxiety, its mouth open in a silent scream that seems to reverberate through the undulating landscape. The blood-red and orange sky swirls dramatically above a dark blue fjord, creating a sense of cosmic disturbance that mirrors the figure's inner turmoil. Munch's use of sinuous, flowing lines and intense, non-naturalistic colors breaks away from traditional representation to express raw human emotion. The painting reflects the artist's own struggles with mental health and his desire to depict \"the scream of nature.\" Its haunting imagery has become a universal symbol of modern anxiety and has profoundly influenced the development of Expressionism, making it one of the most iconic images in Western art.",
                    color: 0xD94A3D
                },
                {
                    title: "Girl with a Pearl Earring",
                    artist: "Johannes Vermeer",
                    year: "c. 1665",
                    medium: "Oil on canvas",
                    description: "Often called the \"Mona Lisa of the North,\" this intimate portrait captures a young girl turning to gaze directly at the viewer with an enigmatic expression that has captivated audiences for centuries. Set against a dark, plain background, the subject's face emerges from the shadows with remarkable luminosity, showcasing Vermeer's masterful command of light and shadow. The girl wears an exotic turban of blue and gold fabric, and the titular pearl earring catches the light with a brilliant highlight, demonstrating Vermeer's extraordinary ability to render the play of light on different surfaces. The soft modeling of her features, the subtle parting of her lips, and the liquid quality of her eyes create an impression of life captured in a fleeting moment. Vermeer's meticulous technique, using thin glazes of paint to build up subtle gradations of tone and color, achieves a photographic realism that was revolutionary for the Dutch Golden Age and continues to inspire artists and viewers alike.",
                    color: 0x8B7355
                }
            ],
            right: [
                {
                    title: "Mona Lisa",
                    artist: "Leonardo da Vinci",
                    year: "1503–1519",
                    medium: "Oil on poplar panel",
                    description: "Perhaps the most famous painting in the world, Leonardo da Vinci's portrait of Lisa Gherardini exemplifies the Renaissance ideals of harmony, balance, and psychological depth. The subject sits in a three-quarter pose before an imaginary landscape of winding paths, distant bridges, and misty mountains that seem to merge with the atmospheric background through Leonardo's pioneering sfumato technique. Her enigmatic smile, achieved through the subtle blending of shadows around her mouth and eyes, has fascinated viewers for over five centuries and sparked countless interpretations. The painting demonstrates Leonardo's deep understanding of anatomy, optics, and the natural world, with the figure's face and hands rendered with unprecedented realism while maintaining an idealized grace. The composition's pyramidal structure, the careful balance between the figure and landscape, and the revolutionary use of aerial perspective create a sense of depth and spatial harmony. The Mona Lisa represents the culmination of Renaissance portraiture and continues to influence artists worldwide, embodying timeless beauty and the mysterious complexity of human expression.",
                    color: 0x8B7355
                },
                {
                    title: "The Last Supper",
                    artist: "Leonardo da Vinci",
                    year: "1495–1498",
                    medium: "Tempera and oil on plaster",
                    description: "This monumental mural depicts the dramatic moment when Christ announces that one of his twelve apostles will betray him, capturing the varied psychological reactions of each disciple in a masterful display of human emotion and narrative complexity. Painted on the wall of the refectory at the Convent of Santa Maria delle Grazie in Milan, the composition uses strict one-point linear perspective with the vanishing point directly behind Christ's head, creating a powerful sense of depth and drawing the viewer's eye to the central figure. Leonardo arranged the twelve apostles in four groups of three, each responding differently to Christ's announcement—with gestures of shock, denial, grief, and questioning—while Judas is subtly identified by his position in shadow and his hand reaching toward the bread. The architectural setting, with its coffered ceiling and tapestries on the walls, frames the scene with Renaissance clarity and order, while the evening light streaming through the windows creates a serene backdrop for the unfolding drama. Despite significant deterioration due to Leonardo's experimental painting technique, this work remains one of the most influential religious paintings ever created, revolutionizing compositional narrative and emotional expression in art.",
                    color: 0x8B6F47
                },
                {
                    title: "Sunflowers",
                    artist: "Vincent van Gogh",
                    year: "1888",
                    medium: "Oil on canvas",
                    description: "From van Gogh's celebrated series of sunflower still lifes created in Arles, this vibrant painting showcases the artist's revolutionary approach to color and his ability to infuse ordinary subjects with profound emotional and symbolic significance. The composition features a vase filled with sunflowers in various stages of bloom—from fresh blossoms to withering heads—arranged against a brilliant yellow background that creates an almost overwhelming sense of warmth and vitality. Van Gogh's thick, energetic brushstrokes built up in layers of impasto give the flowers an intense tactile presence, with each petal and seed head rendered with passionate attention. The bold use of complementary yellows and oranges, applied with varying textures and intensities, creates a dynamic surface that seems to pulse with life and light. For van Gogh, sunflowers symbolized gratitude and devotion, and he created these works to decorate the room of his friend Paul Gauguin. The series represents a high point of van Gogh's artistic achievement, demonstrating his unique ability to transform simple natural subjects into powerful expressions of color, form, and emotion that would profoundly influence the development of modern art.",
                    color: 0xFFB800
                }
            ]
        };

        // ============================================
        // INITIALIZATION
        // ============================================

        function init() {
            console.log('Initializing Three.js scene...');

            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xE8DCC8); // Warm exterior color
            scene.fog = new THREE.Fog(0xE8DCC8, 10, 50);

            // Camera setup
            camera = new THREE.PerspectiveCamera(
                50, // Moderate FOV for natural viewing
                window.innerWidth / window.innerHeight,
                0.1,
                100
            );
            camera.position.set(0, 1.7, 8);
            camera.lookAt(0, 2.5, 0);

            // Renderer setup
            const canvas = document.getElementById('museum-canvas');
            renderer = new THREE.WebGLRenderer({
                canvas,
                antialias: true,
                powerPreference: 'high-performance'
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;

            // Raycaster for interactions
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Lighting - warm, elegant museum lighting
            const ambientLight = new THREE.AmbientLight(0xFFF4E8, 0.5); // Soft warm ambient
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xFFEDD5, 0.8); // Softer, warmer sun
            sunLight.position.set(10, 15, 10);
            sunLight.castShadow = true;
            sunLight.shadow.camera.left = -15;
            sunLight.shadow.camera.right = 15;
            sunLight.shadow.camera.top = 15;
            sunLight.shadow.camera.bottom = -15;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);

            const fillLight = new THREE.DirectionalLight(0xFFF8E0, 0.3); // Warm fill light
            fillLight.position.set(-5, 5, 5);
            scene.add(fillLight);

            console.log('✅ Scene, camera, renderer ready');

            // Build all scenes
            createEntranceScene();
            createCorridorScene();

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('click', onClick);
            canvas.addEventListener('mousedown', onMouseDown);
            canvas.addEventListener('mouseup', onMouseUp);
            canvas.addEventListener('mouseleave', onMouseLeave);
            canvas.addEventListener('wheel', onWheel, { passive: false });
            backBtn.addEventListener('click', goBack);

            // Detail overlay close handlers
            detailCloseBtn.addEventListener('click', closeDetailOverlay);
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && currentView === 'DETAIL') {
                    closeDetailOverlay();
                }
            });

            console.log('✅ Event listeners attached');

            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('fade-out');
                setTimeout(() => {
                    document.getElementById('loading-screen').style.display = 'none';
                }, 500);
            }, 1500);

        function createMarbleTexture() {
            // Create a high-quality procedural marble texture using canvas
            const canvas = document.createElement('canvas');
            canvas.width = 1024; // Higher resolution for better quality
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // Base warm cream/beige color
            ctx.fillStyle = '#F5EDE0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add subtle color variation across the surface
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, 'rgba(250, 245, 235, 0.3)');
            gradient.addColorStop(0.5, 'rgba(245, 237, 224, 0.2)');
            gradient.addColorStop(1, 'rgba(240, 232, 220, 0.3)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Create more prominent marble veins (darker brownish-grey)
            ctx.strokeStyle = 'rgba(160, 145, 130, 0.5)'; // Higher opacity for visibility
            ctx.lineWidth = 3;

            // Major flowing veins (organic, diagonal patterns)
            for (let i = 0; i < 12; i++) {
                ctx.beginPath();
                const startX = Math.random() * canvas.width;
                const startY = Math.random() * canvas.height;
                ctx.moveTo(startX, startY);

                // Create flowing organic curves
                for (let j = 0; j < 6; j++) {
                    const cpX1 = startX + Math.random() * 300 - 150;
                    const cpY1 = startY + Math.random() * 300 - 150;
                    const cpX2 = startX + Math.random() * 400 - 200;
                    const cpY2 = startY + Math.random() * 400 - 200;
                    const endX = startX + Math.random() * 500 - 250;
                    const endY = startY + Math.random() * 500 - 250;
                    ctx.bezierCurveTo(cpX1, cpY1, cpX2, cpY2, endX, endY);
                }
                ctx.stroke();
            }

            // Add thinner darker veins for depth
            ctx.strokeStyle = 'rgba(140, 125, 110, 0.4)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 8; i++) {
                ctx.beginPath();
                const startX = Math.random() * canvas.width;
                const startY = Math.random() * canvas.height;
                ctx.moveTo(startX, startY);

                for (let j = 0; j < 4; j++) {
                    const cpX1 = startX + Math.random() * 200 - 100;
                    const cpY1 = startY + Math.random() * 200 - 100;
                    const cpX2 = startX + Math.random() * 250 - 125;
                    const cpY2 = startY + Math.random() * 250 - 125;
                    const endX = startX + Math.random() * 300 - 150;
                    const endY = startY + Math.random() * 300 - 150;
                    ctx.bezierCurveTo(cpX1, cpY1, cpX2, cpY2, endX, endY);
                }
                ctx.stroke();
            }

            // Add lighter white/cream veins for highlights
            ctx.strokeStyle = 'rgba(255, 252, 245, 0.6)';
            ctx.lineWidth = 2.5;
            for (let i = 0; i < 10; i++) {
                ctx.beginPath();
                const startX = Math.random() * canvas.width;
                const startY = Math.random() * canvas.height;
                ctx.moveTo(startX, startY);

                for (let j = 0; j < 4; j++) {
                    const cpX1 = startX + Math.random() * 180 - 90;
                    const cpY1 = startY + Math.random() * 180 - 90;
                    const cpX2 = startX + Math.random() * 220 - 110;
                    const cpY2 = startY + Math.random() * 220 - 110;
                    const endX = startX + Math.random() * 260 - 130;
                    const endY = startY + Math.random() * 260 - 130;
                    ctx.bezierCurveTo(cpX1, cpY1, cpX2, cpY2, endX, endY);
                }
                ctx.stroke();
            }

            // Add very subtle noise for texture (less than before to avoid graininess)
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const noise = (Math.random() - 0.5) * 6; // Reduced noise
                data[i] += noise;     // R
                data[i + 1] += noise; // G
                data[i + 2] += noise; // B
            }
            ctx.putImageData(imageData, 0, 0);

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        function createChandelier(x, y, z) {
            const chandelierGroup = new THREE.Group();
            chandelierGroup.position.set(x, y, z);
            chandelierGroup.visible = false;

            // Materials
            const goldMat = new THREE.MeshStandardMaterial({
                color: 0xD4AF37, // Rich gold/brass
                roughness: 0.25,
                metalness: 0.85
            });

            const crystalMat = new THREE.MeshStandardMaterial({
                color: 0xE8F4FF, // Slight bluish tint
                roughness: 0.05,
                metalness: 0.1,
                transparent: true,
                opacity: 0.85,
                envMapIntensity: 1.5
            });

            // Top ceiling plate (small circular disc)
            const plateGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.05, 16);
            const plate = new THREE.Mesh(plateGeo, goldMat);
            plate.position.y = 0.15;
            chandelierGroup.add(plate);

            // Central vertical stem (thin metallic cylinder)
            const stemGeo = new THREE.CylinderGeometry(0.04, 0.04, 1.2, 12);
            const stem = new THREE.Mesh(stemGeo, goldMat);
            stem.position.y = -0.45;
            chandelierGroup.add(stem);

            // 4 Circular tiers/rings with decreasing radii
            const tiers = [
                { radius: 0.7, y: -0.2, crystals: 10 },
                { radius: 0.55, y: -0.5, crystals: 8 },
                { radius: 0.4, y: -0.8, crystals: 6 },
                { radius: 0.25, y: -1.0, crystals: 5 }
            ];

            tiers.forEach(tier => {
                // Gold ring/hoop
                const ringGeo = new THREE.TorusGeometry(tier.radius, 0.025, 8, 24);
                const ring = new THREE.Mesh(ringGeo, goldMat);
                ring.rotation.x = Math.PI / 2;
                ring.position.y = tier.y;
                chandelierGroup.add(ring);

                // Hanging crystals from this tier
                for (let i = 0; i < tier.crystals; i++) {
                    const angle = (i / tier.crystals) * Math.PI * 2;

                    // Elongated crystal cone (varying lengths for organic feel)
                    const crystalLength = 0.25 + Math.random() * 0.15;
                    const crystalGeo = new THREE.ConeGeometry(0.04, crystalLength, 6);
                    const crystal = new THREE.Mesh(crystalGeo, crystalMat);

                    crystal.position.set(
                        Math.cos(angle) * tier.radius,
                        tier.y - crystalLength / 2 - 0.05,
                        Math.sin(angle) * tier.radius
                    );
                    crystal.rotation.x = Math.PI; // Point downward
                    chandelierGroup.add(crystal);

                    // Small sphere at attachment point
                    const beadGeo = new THREE.SphereGeometry(0.03, 8, 8);
                    const bead = new THREE.Mesh(beadGeo, crystalMat);
                    bead.position.set(
                        Math.cos(angle) * tier.radius,
                        tier.y - 0.02,
                        Math.sin(angle) * tier.radius
                    );
                    chandelierGroup.add(bead);
                }
            });

            // Central glowing orbs/bulbs inside the chandelier
            const bulbMat = new THREE.MeshStandardMaterial({
                color: 0xFFF4E0,
                emissive: 0xFFE8B0,
                emissiveIntensity: 0.6,
                roughness: 0.3,
                metalness: 0.1
            });

            for (let i = 0; i < 3; i++) {
                const bulbGeo = new THREE.SphereGeometry(0.08, 12, 12);
                const bulb = new THREE.Mesh(bulbGeo, bulbMat);
                bulb.position.y = -0.3 - i * 0.3;
                chandelierGroup.add(bulb);
            }

            // Warm point light at center
            const warmLight = new THREE.PointLight(0xFFF1C4, 1.2, 18);
            warmLight.position.set(0, -0.5, 0);
            warmLight.castShadow = false; // Avoid harsh shadows

        function createPlaqueLabel(text) {
            // Create high-resolution offscreen canvas for crisp text
            const canvas = document.createElement('canvas');
            canvas.width = 2048;  // 4x resolution for sharp rendering
            canvas.height = 512;  // 4x resolution
            const ctx = canvas.getContext('2d', { alpha: false });

            // Enable high-quality text rendering
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            // Dark wood background
            ctx.fillStyle = '#3b2a16';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add subtle wood grain texture
            ctx.fillStyle = 'rgba(70, 50, 30, 0.15)';
            for (let i = 0; i < 20; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const width = Math.random() * 100 + 50;
                ctx.fillRect(x, y, width, 2);
            }

            // Gold text with shadow for depth
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;

            // High-resolution serif font (4x size for 4x canvas)
            ctx.font = 'bold 168px "Garamond", "Times New Roman", serif';
            ctx.fillStyle = '#f5e2a8';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            // Add slight highlight on text for polished look
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255, 250, 230, 0.3)';
            ctx.font = 'bold 168px "Garamond", "Times New Roman", serif';
            ctx.fillText(text, canvas.width / 2 - 1, canvas.height / 2 - 2);

            // Create texture from canvas with optimal filtering
            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;

            // Critical: Set proper texture filtering for sharp text
            texture.minFilter = THREE.LinearFilter;  // Prevents pixelation when far
            texture.magFilter = THREE.LinearFilter;  // Smooth when close
            texture.generateMipmaps = false;  // Not needed with LinearFilter

            // Enable anisotropic filtering for maximum sharpness at angles
            const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();
            texture.anisotropy = Math.min(16, maxAnisotropy);

            // Create plane with the text texture
            const labelGeo = new THREE.PlaneGeometry(0.95, 0.14);
            const labelMat = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: false,
                depthWrite: true,
                depthTest: true
            });
            const labelMesh = new THREE.Mesh(labelGeo, labelMat);

            return labelMesh;
        }

        function createWallPaintings(side, xPos, storageArray) {
            const artworks = ARTWORKS[side];
            const rotation = side === 'left' ? Math.PI / 2 : -Math.PI / 2;

            // Evenly space 3 paintings along the wall
            // Corridor extends from z=0 to z=-30

                const zPos = paintingZPositions[i];

                const paintingGroup = new THREE.Group();

                paintingGroup.userData.clickable = true;

        function enterMuseum() {
            if (isAnimating) return;
            isAnimating = true;
            console.log('🚶 Entering museum...');

            // Animate doors opening OUTWARD
            const duration = 1500;
            const startTime = Date.now();

            function animateDoorOpen() {
                const elapsed = Date.now() - startTime;
                const t = Math.min(elapsed / duration, 1);
                const eased = easeInOutCubic(t);

                leftDoorPanel.rotation.y = -eased * (Math.PI / 2.5);
                rightDoorPanel.rotation.y = eased * (Math.PI / 2.5);

                if (t < 1) {
                    requestAnimationFrame(animateDoorOpen);
                } else {
                    createWhiteLightTransition();
                }
            }

            animateDoorOpen();
        }

        function createWhiteLightTransition() {
            // White overlay for portal effect
            const whiteFade = document.createElement('div');
            whiteFade.style.position = 'fixed';
            whiteFade.style.top = '0';
            whiteFade.style.left = '0';
            whiteFade.style.width = '100%';
            whiteFade.style.height = '100%';
            whiteFade.style.background = 'radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,255,255,0.95) 100%)';
            whiteFade.style.opacity = '0';
            whiteFade.style.transition = 'opacity 0.8s ease-in';
            whiteFade.style.zIndex = '999';
            whiteFade.style.pointerEvents = 'none';
            document.body.appendChild(whiteFade);

            setTimeout(() => {
                whiteFade.style.opacity = '1';
            }, 50);

            setTimeout(() => {
                entranceDoor.visible = false;
                scene.background = new THREE.Color(0xFAF8F3);
                scene.fog = new THREE.Fog(0xFAF8F3, 15, 35); // Adjusted for 30m corridor
                corridorGroup.forEach(obj => obj.visible = true);

                camera.position.set(0, 1.7, -2); // Near entrance, looking down corridor
                camera.rotation.set(0, 0, 0);
                camera.lookAt(0, 2, -15); // Look toward far end of corridor
            }, 800);

            setTimeout(() => {
                whiteFade.style.transition = 'opacity 1s ease-out';
                whiteFade.style.opacity = '0';
            }, 1000);

            setTimeout(() => {
                document.body.removeChild(whiteFade);
                currentView = 'CORRIDOR';
                isAnimating = false;
                backBtn.classList.add('hidden'); // Hide exit button
                wallHintLeft.classList.remove('hidden');
                wallHintRight.classList.remove('hidden');
                console.log('✅ Inside corridor');
            }, 2000);
        }

        function viewWall(side) {
            if (isAnimating) return;
            isAnimating = true;
            console.log(`👁️ Viewing ${side} wall...`);

            wallHintLeft.classList.add('hidden');
            wallHintRight.classList.add('hidden');

            // Position camera in middle of corridor, facing the wall
            // Paintings are at z = -5, -10, -15, so center at z = -10
            // Camera stays in center of room width, clear view of wall
            const targetAngle = side === 'left' ? Math.PI / 2 : -Math.PI / 2;
            const targetPos = new THREE.Vector3(0, 2, -10); // Middle of corridor, painting height

            animateCamera(
                camera.position.clone(),
                targetPos,
                camera.rotation.clone(),
                new THREE.Euler(0, targetAngle, 0),
                1200, // Slower transition for smoothness
                () => {
                    currentView = side === 'left' ? 'WALL_LEFT' : 'WALL_RIGHT';
                    isAnimating = false;
                    backBtn.classList.remove('hidden');
                    backText.textContent = 'Back to Corridor';
                    console.log(`✅ Viewing ${side} wall - all 3 paintings visible`);
                }
            );
        }

                detailTitle.textContent = artworkData.title;
                detailArtist.textContent = artworkData.artist;
                detailYear.textContent = artworkData.year;
                detailMedium.textContent = artworkData.medium;
                detailDescription.textContent = artworkData.description;

                // Show the detail overlay (initially transparent)
                detailOverlay.style.opacity = '0';
                detailOverlay.classList.add('active');

                // Show back button
                backBtn.classList.remove('hidden');
                backText.textContent = 'Back to Gallery';

                // Update state
                currentView = 'DETAIL';
                console.log('✅ Detail view ready - pure black 2D overlay');

                // Setup 360° rotation and zoom interaction
                setupPaintingInteraction();

                // Wait at peak brightness, then create a smooth crossfade
                setTimeout(() => {
                    // Simultaneously fade in detail and fade out white (crossfade effect)
                    detailOverlay.style.transition = 'opacity 1.2s ease-in-out';
                    detailOverlay.style.opacity = '1';

                    whiteFade.style.transition = 'opacity 1.2s ease-in-out';
                    whiteFade.style.opacity = '0';

                    setTimeout(() => {
                        document.body.removeChild(whiteFade);
                    }, 1200);
                }, 400);
            }, 1000);
        }

        // Painting interaction state
        let rotationY = 0;
        let scale = 1;
        let isDraggingPainting = false;
        let lastMouseX = 0;
        let paintingFrame = null;

        // Event handlers for painting interaction
        let onPaintingMouseDown, onPaintingMouseMove, onPaintingMouseUp, onPaintingWheel;

        function setupPaintingInteraction() {
            paintingFrame = document.querySelector('.painting-frame');
            if (!paintingFrame) return;

            // Reset rotation and scale
            rotationY = 0;
            scale = 1;
            paintingFrame.style.transform = 'rotateY(0deg) scale(1)';

            // Define event handlers
            onPaintingMouseDown = (e) => {
                isDraggingPainting = true;
                lastMouseX = e.clientX;
                e.preventDefault();
            };

            onPaintingMouseMove = (e) => {
                if (!isDraggingPainting) return;
                const deltaX = e.clientX - lastMouseX;
                lastMouseX = e.clientX;
                rotationY += deltaX * 0.3;
                paintingFrame.style.transform = `rotateY(${rotationY}deg) scale(${scale})`;
            };

            onPaintingMouseUp = () => {
                isDraggingPainting = false;
            };

            onPaintingWheel = (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -0.05 : 0.05;
                scale = Math.max(0.5, Math.min(2, scale + delta));
                paintingFrame.style.transform = `rotateY(${rotationY}deg) scale(${scale})`;
            };

            // Attach event listeners
            paintingFrame.addEventListener('mousedown', onPaintingMouseDown);
            window.addEventListener('mousemove', onPaintingMouseMove);
            window.addEventListener('mouseup', onPaintingMouseUp);
            paintingFrame.addEventListener('wheel', onPaintingWheel, { passive: false });

            console.log('✅ Painting interaction enabled (drag to rotate, scroll to zoom)');
        }

        function cleanupPaintingInteraction() {
            if (!paintingFrame) return;

            // Remove event listeners
            paintingFrame.removeEventListener('mousedown', onPaintingMouseDown);
            window.removeEventListener('mousemove', onPaintingMouseMove);
            window.removeEventListener('mouseup', onPaintingMouseUp);
            paintingFrame.removeEventListener('wheel', onPaintingWheel);

            // Reset state
            isDraggingPainting = false;
            rotationY = 0;
            scale = 1;
            paintingFrame = null;

            console.log('✅ Painting interaction cleaned up');
        }

        function closeDetailOverlay() {
            if (currentView !== 'DETAIL') return;
            console.log('⬅️ Closing detail overlay...');

            // Cleanup painting interaction listeners
            cleanupPaintingInteraction();

            // Determine which wall we were viewing and return to it
            const side = selectedPainting ?
                (ARTWORKS.left.includes(selectedPainting) ? 'left' : 'right') :
                'left';

            // Fade out detail overlay first
            detailOverlay.style.transition = 'opacity 0.5s ease-in-out';
            detailOverlay.style.opacity = '0';

            setTimeout(() => {
                // White fade-in transition
                const whiteFade = document.createElement('div');
                whiteFade.style.position = 'fixed';
                whiteFade.style.top = '0';
                whiteFade.style.left = '0';
                whiteFade.style.width = '100%';
                whiteFade.style.height = '100%';
                whiteFade.style.background = 'radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,255,255,0.95) 100%)';
                whiteFade.style.opacity = '0';
                whiteFade.style.transition = 'opacity 0.7s ease-in-out';
                whiteFade.style.zIndex = '2999';
                whiteFade.style.pointerEvents = 'none';
                document.body.appendChild(whiteFade);

                setTimeout(() => {
                    whiteFade.style.opacity = '1';
                }, 50);

                setTimeout(() => {
                    // Hide the detail overlay
                    detailOverlay.classList.remove('active');
                    detailOverlay.style.opacity = '1'; // Reset for next time

                    // Show canvas again
                    renderer.domElement.style.display = 'block';

                    // Restore gallery scene
                    scene.background = new THREE.Color(0xFAF8F3);
                    scene.fog = new THREE.Fog(0xFAF8F3, 15, 35);
                    renderer.setClearColor(0xFAF8F3, 1);

                    // Show corridor objects again
                    corridorGroup.forEach(obj => obj.visible = true);

                    const targetAngle = side === 'left' ? Math.PI / 2 : -Math.PI / 2;
                    const targetPos = new THREE.Vector3(0, 2, -10);

                    // Snap camera back to wall view instantly
                    camera.position.copy(targetPos);
                    camera.rotation.set(0, targetAngle, 0);

                    currentView = side === 'left' ? 'WALL_LEFT' : 'WALL_RIGHT';
                    selectedPainting = null;

                    // Keep back button visible and update text
                    backBtn.classList.remove('hidden');
                    backText.textContent = 'Back to Corridor';

                    console.log(`✅ Returned to ${side} wall view`);

                    // Wait a bit at peak brightness, then fade out white
                    setTimeout(() => {
                        whiteFade.style.transition = 'opacity 0.7s ease-in-out';
                        whiteFade.style.opacity = '0';

                        setTimeout(() => {
                            document.body.removeChild(whiteFade);
                        }, 700);
                    }, 300);
                }, 700);
            }, 500);
        }

        function goBack() {
            if (isAnimating) return;
            console.log('⬅️ Going back...');

            if (currentView === 'DETAIL') {
                // Use the new closeDetailOverlay function
                closeDetailOverlay();

            } else if (currentView === 'WALL_LEFT' || currentView === 'WALL_RIGHT') {
                isAnimating = true;

                // Smooth transition back to corridor entrance
                animateCamera(
                    camera.position.clone(),
                    new THREE.Vector3(0, 1.7, -2), // Return to entrance position
                    camera.rotation.clone(),
                    new THREE.Euler(0, 0, 0),
                    1400, // Longer duration for smoother transition
                    () => {
                        currentView = 'CORRIDOR';
                        isAnimating = false;
                        backBtn.classList.add('hidden'); // Hide exit button
                        wallHintLeft.classList.remove('hidden');
                        wallHintRight.classList.remove('hidden');
                        camera.lookAt(0, 2, -15); // Look down corridor
                    }
                );

            }
            // Removed: No exit from corridor - user stays in museum
        }

        // ============================================
        // CAMERA ANIMATION
        // ============================================

        function animateCamera(fromPos, toPos, fromRot, toRot, duration, callback) {
            const startTime = Date.now();
            const startPos = fromPos.clone();
            const startRot = fromRot.clone();

            function updateCamera() {
                const elapsed = Date.now() - startTime;
                const t = Math.min(elapsed / duration, 1);
                const eased = easeInOutCubic(t);

                camera.position.lerpVectors(startPos, toPos, eased);
                camera.rotation.x = THREE.MathUtils.lerp(startRot.x, toRot.x, eased);
                camera.rotation.y = THREE.MathUtils.lerp(startRot.y, toRot.y, eased);
                camera.rotation.z = THREE.MathUtils.lerp(startRot.z, toRot.z, eased);

                if (t < 1) {
                    requestAnimationFrame(updateCamera);
                } else {
                    if (callback) callback();
                }
            }

            updateCamera();
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        // ============================================
        // RENDER LOOP
        // ============================================

        function animate() {
            requestAnimationFrame(animate);

            if (hoveredPainting && (currentView === 'WALL_LEFT' || currentView === 'WALL_RIGHT')) {
                const targetScale = 1.05;
                hoveredPainting.scale.setScalar(
                    THREE.MathUtils.lerp(hoveredPainting.scale.x, targetScale, 0.08)
                );
            }

            const allPaintings = [...leftWallPaintings, ...rightWallPaintings];
            allPaintings.forEach(painting => {
                if (painting !== hoveredPainting && painting.scale.x > 1.001) {
                    painting.scale.setScalar(
                        THREE.MathUtils.lerp(painting.scale.x, 1, 0.08)
                    );
                }
            });

            renderer.render(scene, camera);
        }

        // ============================================
        // EVENT HANDLERS
        // ============================================

        function onMouseMove(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            // Skip interactions when in detail overlay (pure 2D mode)
            if (currentView === 'DETAIL') {
                return;
            }

            // Hover detection
            if (!isDragging && !isAnimating) {
                raycaster.setFromCamera(mouse, camera);
                let cursor = 'default';
                let foundHover = null;

                if (currentView === 'ENTRANCE') {
                    const hits = raycaster.intersectObject(entranceDoor, true);
                    if (hits.length > 0) cursor = 'pointer';

                } else if (currentView === 'CORRIDOR') {
                    const hits = raycaster.intersectObjects(scene.children, true);
                    for (const hit of hits) {
                        if (hit.object.userData.clickable && hit.object.userData.type === 'wall') {
                            cursor = 'pointer';
                            break;
                        }
                    }

                } else if (currentView === 'WALL_LEFT' || currentView === 'WALL_RIGHT') {
                    const hits = raycaster.intersectObjects(scene.children, true);
                    for (const hit of hits) {
                        let obj = hit.object;
                        while (obj.parent && !obj.userData.clickable) obj = obj.parent;
                        if (obj.userData.type === 'painting') {
                            cursor = 'pointer';
                            foundHover = obj;
                            break;
                        }
                    }
                }

                hoveredPainting = foundHover;
                renderer.domElement.style.cursor = cursor;
            }
        }

        function onClick(event) {
            if (isAnimating) return;

            raycaster.setFromCamera(mouse, camera);

            if (currentView === 'ENTRANCE') {
                const hits = raycaster.intersectObject(entranceDoor, true);
                if (hits.length > 0) {
                    console.log('🚪 Door clicked');
                    enterMuseum();
                }

            } else if (currentView === 'CORRIDOR') {
                const hits = raycaster.intersectObjects(scene.children, true);
                for (const hit of hits) {
                    if (hit.object.userData.clickable && hit.object.userData.type === 'wall') {
                        console.log(`🖼️ ${hit.object.userData.side} wall clicked`);
                        viewWall(hit.object.userData.side);
                        break;
                    }
                }

            } else if (currentView === 'WALL_LEFT' || currentView === 'WALL_RIGHT') {
                const hits = raycaster.intersectObjects(scene.children, true);
                for (const hit of hits) {
                    let obj = hit.object;
                    while (obj.parent && !obj.userData.clickable) obj = obj.parent;
                    if (obj.userData.type === 'painting') {
                        viewArtworkDetail(obj.userData.data);
                        break;
                    }
                }
            }
        }

        function onMouseDown(event) {
            // No mouse interactions needed in detail overlay (pure 2D mode)
        }

        function onMouseUp(event) {
            // No mouse interactions needed in detail overlay (pure 2D mode)
        }

        function onMouseLeave(event) {
            // No mouse interactions needed in detail overlay (pure 2D mode)
        }

        function onWheel(event) {
            // No wheel zoom needed in detail overlay (pure 2D mode)
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ============================================
        // UI FUNCTIONS
        // ============================================

        function showArtworkInfo(data) {
            document.getElementById('artwork-title').textContent = data.title;
            document.getElementById('artwork-artist').textContent = data.artist;
            document.getElementById('artwork-year').textContent = data.year;
            document.getElementById('artwork-medium').textContent = data.medium;
            document.getElementById('artwork-description').textContent = data.description;
            infoPanel.classList.remove('hidden');
        }

        function hideArtworkInfo() {
            infoPanel.classList.add('hidden');
        }

        // ============================================
        // START APPLICATION
        // ============================================

        init();
    </script>
</body>
</html>
