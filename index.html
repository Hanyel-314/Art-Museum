<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Art Museum</title>

    <!-- Import map for Three.js CDN -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
    </script>

    <style>
        /* ============================================
           GLOBAL STYLES
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            overflow: hidden;
            background: #000;
        }

        #museum-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: default;
        }

        /* ============================================
           LOADING SCREEN
           ============================================ */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease-out;
        }

        #loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loading-content {
            text-align: center;
            color: #fff;
        }

        .loading-content h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            font-weight: 300;
            letter-spacing: 4px;
            font-family: 'Georgia', serif;
        }

        .loading-bar {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin: 0 auto;
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #d4af37, #f4e5c2);
            width: 100%;
            animation: loadProgress 1.5s ease-out;
        }

        @keyframes loadProgress {
            from { width: 0%; }
            to { width: 100%; }
        }

        .loading-text {
            margin-top: 1rem;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        /* ============================================
           UI OVERLAY
           ============================================ */
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .hidden {
            display: none !important;
        }

        /* Back Button */
        .nav-button {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 2px solid rgba(212, 175, 55, 0.6);
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            pointer-events: all;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            backdrop-filter: blur(10px);
        }

        .nav-button:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: #d4af37;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .back-arrow {
            font-size: 1.2rem;
        }

        /* Artwork Info Panel */
        .info-panel {
            position: absolute;
            top: 2rem;
            right: 2rem;
            width: 350px;
            max-height: 80vh;
            background: linear-gradient(135deg, rgba(20, 30, 48, 0.95), rgba(30, 40, 60, 0.95));
            color: #fff;
            padding: 2rem;
            border-radius: 12px;
            pointer-events: all;
            overflow-y: auto;
            border: 2px solid rgba(212, 175, 55, 0.5);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4), 0 8px 32px rgba(0, 0, 0, 0.8);
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .info-panel h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #FFD700;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .info-panel .artwork-artist {
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
            font-style: italic;
            opacity: 0.9;
        }

        .info-panel .artwork-year,
        .info-panel .artwork-medium {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 0.3rem;
        }

        .info-panel .artwork-description {
            margin-top: 1rem;
            line-height: 1.6;
            font-size: 0.95rem;
            opacity: 0.85;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.3s;
            pointer-events: all;
        }

        .close-btn:hover {
            opacity: 1;
        }

        .interaction-hint {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .interaction-hint p {
            font-size: 0.85rem;
            opacity: 0.6;
            margin: 0.3rem 0;
        }

        /* Wall Hints */
        .wall-hint {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            pointer-events: none;
            border: 2px solid rgba(212, 175, 55, 0.4);
            animation: fadeSlide 0.5s ease-out;
        }

        #wall-hint-left {
            left: 2rem;
        }

        #wall-hint-right {
            right: 2rem;
        }

        @keyframes fadeSlide {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Scrollbar Styling */
        .info-panel::-webkit-scrollbar {
            width: 6px;
        }

        .info-panel::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .info-panel::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.5);
            border-radius: 3px;
        }

        .info-panel::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 175, 55, 0.7);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .info-panel {
                width: calc(100% - 2rem);
                right: 1rem;
                top: 1rem;
                max-height: 60vh;
            }

            .nav-button {
                bottom: 1rem;
                left: 1rem;
            }
        }

        /* ============================================
           FULL-SCREEN DETAIL OVERLAY (PURE BLACK 2D)
           ============================================ */
        .detail-overlay {
            position: fixed;
            inset: 0;
            background: #000000;
            z-index: 2000;
            display: none; /* Hidden by default */
            align-items: center;
            justify-content: center;
        }

        .detail-overlay.active {
            display: flex;
        }

        .detail-content {
            display: flex;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            gap: 4rem;
            padding: 2rem;
        }

        /* Left Side: Framed Painting */
        .detail-painting-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 600px;
        }

        .painting-frame {
            position: relative;
            padding: 1.5rem;
            background: linear-gradient(135deg, #D4AF37 0%, #F4E5C2 50%, #D4AF37 100%);
            border-radius: 4px;
            box-shadow:
                0 0 0 3px #8B7355,
                0 0 30px rgba(212, 175, 55, 0.5),
                inset 0 0 20px rgba(139, 115, 85, 0.3);
        }

        .painting-canvas {
            width: 400px;
            height: 400px;
            border: 2px solid #8B7355;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
        }

        /* Right Side: Info Panel */
        .detail-info-panel {
            position: relative;
            flex: 0 0 450px;
            max-width: 450px;
            background: linear-gradient(135deg, rgba(17, 24, 39, 0.95), rgba(31, 41, 55, 0.95));
            border: 2px solid rgba(212, 175, 55, 0.6);
            border-radius: 12px;
            padding: 2.5rem;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow:
                0 0 40px rgba(212, 175, 55, 0.4),
                0 10px 50px rgba(0, 0, 0, 0.8);
        }

        .detail-close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            opacity: 0.7;
            transition: all 0.3s;
            line-height: 1;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .detail-close-btn:hover {
            opacity: 1;
            color: #FFD700;
            transform: scale(1.1);
        }

        .detail-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #FFD700;
            font-weight: 600;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            line-height: 1.2;
            padding-right: 2rem;
        }

        .detail-artist {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            font-style: italic;
            opacity: 0.95;
            color: #E5E7EB;
        }

        .detail-year,
        .detail-medium {
            font-size: 1rem;
            opacity: 0.75;
            margin-bottom: 0.4rem;
            color: #D1D5DB;
        }

        .detail-description {
            margin-top: 1.5rem;
            line-height: 1.8;
            font-size: 1.05rem;
            opacity: 0.9;
            color: #E5E7EB;
        }

        .detail-interaction-hint {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-interaction-hint p {
            font-size: 0.9rem;
            opacity: 0.6;
            margin: 0.3rem 0;
            color: #D1D5DB;
        }

        /* Responsive for Detail Overlay */
        @media (max-width: 1024px) {
            .detail-content {
                flex-direction: column;
                gap: 2rem;
                overflow-y: auto;
            }

            .detail-painting-container {
                max-width: 500px;
            }

            .painting-canvas {
                width: 350px;
                height: 350px;
            }

            .detail-info-panel {
                flex: 0 0 auto;
                max-width: 500px;
                width: 100%;
            }
        }

        @media (max-width: 768px) {
            .painting-canvas {
                width: 300px;
                height: 300px;
            }

            .detail-title {
                font-size: 2rem;
            }

            .detail-artist {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <h1>ART MUSEUM</h1>
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
            <p class="loading-text">Preparing your experience...</p>
        </div>
    </div>

    <!-- Main Canvas -->
    <canvas id="museum-canvas"></canvas>

    <!-- UI Overlay -->
    <div id="ui-overlay">
        <!-- Back Button -->
        <button id="back-button" class="nav-button hidden">
            <span class="back-arrow">←</span> <span id="back-text">Back</span>
        </button>

        <!-- Artwork Info Panel (OLD - keeping for compatibility) -->
        <div id="artwork-info" class="info-panel hidden">
            <button class="close-btn" id="close-info">×</button>
            <h2 id="artwork-title"></h2>
            <p class="artwork-artist" id="artwork-artist"></p>
            <p class="artwork-year" id="artwork-year"></p>
            <p class="artwork-medium" id="artwork-medium"></p>
            <p class="artwork-description" id="artwork-description"></p>
            <div class="interaction-hint">
                <p>🖱️ Drag to rotate 360°</p>
                <p>🔍 Scroll to zoom</p>
            </div>
        </div>

        <!-- Wall Selection Hints -->
        <div id="wall-hint-left" class="wall-hint hidden">
            ← View Left Gallery
        </div>
        <div id="wall-hint-right" class="wall-hint hidden">
            View Right Gallery →
        </div>
    </div>

    <!-- Full-Screen Detail Overlay (Pure Black 2D View) -->
    <div id="detail-overlay" class="detail-overlay">
        <div class="detail-content">
            <!-- Left Side: Framed Painting -->
            <div class="detail-painting-container">
                <div class="painting-frame">
                    <div id="detail-painting" class="painting-canvas"></div>
                </div>
            </div>

            <!-- Right Side: Info Panel -->
            <div class="detail-info-panel">
                <button class="detail-close-btn" id="detail-close">×</button>
                <h2 id="detail-title" class="detail-title"></h2>
                <p id="detail-artist" class="detail-artist"></p>
                <p id="detail-year" class="detail-year"></p>
                <p id="detail-medium" class="detail-medium"></p>
                <p id="detail-description" class="detail-description"></p>
                <div class="detail-interaction-hint">
                    <p>Press ESC or click × to return to gallery</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // ============================================
        // INTERACTIVE ART MUSEUM - COMPLETE VERSION
        // ============================================

        import * as THREE from 'three';

        console.log('🎨 Art Museum Initializing...');

        // ============================================
        // STATE MACHINE & GLOBAL STATE
        // ============================================

        let scene, camera, renderer;
        let currentView = 'ENTRANCE'; // ENTRANCE, CORRIDOR, WALL_LEFT, WALL_RIGHT, DETAIL
        let isAnimating = false;
        let selectedPainting = null;

        // Scene Objects
        let entranceDoor, leftDoorPanel, rightDoorPanel;
        let corridorGroup = [];
        let leftWallPaintings = [];
        let rightWallPaintings = [];
        let detailArtwork = null;
        let hoveredPainting = null;

        // Interaction
        let raycaster, mouse;
        let isDragging = false;
        let previousMouse = { x: 0, y: 0 };

        // Lighting
        let detailKeyLight, detailRimLight, detailFillLight;

        // UI Elements
        const backBtn = document.getElementById('back-button');
        const backText = document.getElementById('back-text');
        const infoPanel = document.getElementById('artwork-info');
        const wallHintLeft = document.getElementById('wall-hint-left');
        const wallHintRight = document.getElementById('wall-hint-right');

        // Detail Overlay Elements
        const detailOverlay = document.getElementById('detail-overlay');
        const detailPainting = document.getElementById('detail-painting');
        const detailCloseBtn = document.getElementById('detail-close');
        const detailTitle = document.getElementById('detail-title');
        const detailArtist = document.getElementById('detail-artist');
        const detailYear = document.getElementById('detail-year');
        const detailMedium = document.getElementById('detail-medium');
        const detailDescription = document.getElementById('detail-description');

        // ============================================
        // ARTWORK DATA
        // ============================================

        const ARTWORKS = {
            left: [
                {
                    title: "Starry Night",
                    artist: "Vincent van Gogh",
                    year: "1889",
                    medium: "Oil on canvas",
                    description: "A swirling, dreamlike vision of the night sky over a French village, expressing deep emotion through bold brushstrokes and vivid colors.",
                    color: 0x2B4C7E
                },
                {
                    title: "The Great Wave",
                    artist: "Katsushika Hokusai",
                    year: "1831",
                    medium: "Woodblock print",
                    description: "An iconic Japanese ukiyo-e print depicting a towering wave threatening boats near Mount Fuji, symbolizing nature's power.",
                    color: 0x1E5A8E
                },
                {
                    title: "Girl with a Pearl Earring",
                    artist: "Johannes Vermeer",
                    year: "1665",
                    medium: "Oil on canvas",
                    description: "Often called the 'Mona Lisa of the North,' this intimate portrait captures a girl's enigmatic gaze and luminous pearl earring.",
                    color: 0x8B7355
                }
            ],
            right: [
                {
                    title: "The Scream",
                    artist: "Edvard Munch",
                    year: "1893",
                    medium: "Oil, tempera, pastel",
                    description: "An expressionist icon depicting overwhelming anxiety, with a distorted figure against a blood-red sky, representing universal human anguish.",
                    color: 0xD94A3D
                },
                {
                    title: "The Birth of Venus",
                    artist: "Sandro Botticelli",
                    year: "1485",
                    medium: "Tempera on canvas",
                    description: "A Renaissance masterpiece showing Venus emerging from the sea as a fully grown woman, embodying classical beauty and mythological grace.",
                    color: 0xE8C4A8
                },
                {
                    title: "The Kiss",
                    artist: "Gustav Klimt",
                    year: "1908",
                    medium: "Oil and gold leaf",
                    description: "A shimmering Art Nouveau work depicting lovers embraced in ornate golden robes, symbolizing passion, intimacy, and eternal love.",
                    color: 0xD4AF37
                }
            ]
        };

        // ============================================
        // INITIALIZATION
        // ============================================

        function init() {
            console.log('Initializing Three.js scene...');

            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xE8DCC8); // Warm exterior color
            scene.fog = new THREE.Fog(0xE8DCC8, 10, 50);

            // Camera setup
            camera = new THREE.PerspectiveCamera(
                50, // Moderate FOV for natural viewing
                window.innerWidth / window.innerHeight,
                0.1,
                100
            );
            camera.position.set(0, 1.7, 8);
            camera.lookAt(0, 2.5, 0);

            // Renderer setup
            const canvas = document.getElementById('museum-canvas');
            renderer = new THREE.WebGLRenderer({
                canvas,
                antialias: true,
                powerPreference: 'high-performance'
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;

            // Raycaster for interactions
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Lighting - warm outdoor lighting
            const ambientLight = new THREE.AmbientLight(0xFFF8E7, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xFFE4B5, 1.2);
            sunLight.position.set(10, 15, 10);
            sunLight.castShadow = true;
            sunLight.shadow.camera.left = -15;
            sunLight.shadow.camera.right = 15;
            sunLight.shadow.camera.top = 15;
            sunLight.shadow.camera.bottom = -15;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);

            const fillLight = new THREE.DirectionalLight(0xB0C4DE, 0.4);
            fillLight.position.set(-5, 5, 5);
            scene.add(fillLight);

            console.log('✅ Scene, camera, renderer ready');

            // Build all scenes
            createEntranceScene();
            createCorridorScene();

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('click', onClick);
            canvas.addEventListener('mousedown', onMouseDown);
            canvas.addEventListener('mouseup', onMouseUp);
            canvas.addEventListener('mouseleave', onMouseLeave);
            canvas.addEventListener('wheel', onWheel, { passive: false });
            backBtn.addEventListener('click', goBack);

            // Detail overlay close handlers
            detailCloseBtn.addEventListener('click', closeDetailOverlay);
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && currentView === 'DETAIL') {
                    closeDetailOverlay();
                }
            });

            console.log('✅ Event listeners attached');

            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('fade-out');
                setTimeout(() => {
                    document.getElementById('loading-screen').style.display = 'none';
                }, 500);
            }, 1500);

            // Start render loop
            animate();
            console.log('🎉 Museum ready!');
        }

        // ============================================
        // ENTRANCE SCENE - Museum Facade
        // ============================================

        function createEntranceScene() {
            console.log('Creating entrance scene...');

            // Stone ground
            const groundGeo = new THREE.PlaneGeometry(30, 30);
            const groundMat = new THREE.MeshStandardMaterial({
                color: 0xC8B8A0,
                roughness: 0.8,
                metalness: 0.1
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.1; // Slightly below corridor floor to prevent z-fighting
            ground.receiveShadow = true;
            scene.add(ground);

            // Golden light portal behind doors
            const portalGeo = new THREE.PlaneGeometry(6, 8);
            const portalMat = new THREE.MeshStandardMaterial({
                color: 0xFFD700,
                emissive: 0xFFD700,
                emissiveIntensity: 1.5,
                roughness: 0.2,
                metalness: 0.3
            });
            const portal = new THREE.Mesh(portalGeo, portalMat);
            portal.position.set(0, 4, -0.3);
            scene.add(portal);

            // Add golden glow light
            const portalLight = new THREE.PointLight(0xFFD700, 2, 20);
            portalLight.position.set(0, 4, 0);
            scene.add(portalLight);

            // "ART MUSEUM" sign
            createMuseumSign();

            // Pillars - moved to entrance area only, away from corridor
            createPillar(-4.5, 0, -1);
            createPillar(4.5, 0, -1);

            // Museum door assembly
            entranceDoor = new THREE.Group();
            entranceDoor.position.set(0, 0, 0);

            // Door frame - ornate brass
            const frameGeo = new THREE.BoxGeometry(4.5, 5.5, 0.3);
            const frameMat = new THREE.MeshStandardMaterial({
                color: 0xB8860B,
                roughness: 0.3,
                metalness: 0.7
            });
            const doorFrame = new THREE.Mesh(frameGeo, frameMat);
            doorFrame.position.set(0, 2.75, 0.05);
            entranceDoor.add(doorFrame);

            // Left door panel - pivot on LEFT edge for outward opening
            leftDoorPanel = new THREE.Group();
            leftDoorPanel.position.set(-2.4, 2.5, 0.1); // Moved left to create gap

            const leftDoorGeo = new THREE.BoxGeometry(1.9, 5, 0.15); // Slightly narrower
            const doorMat = new THREE.MeshStandardMaterial({
                color: 0x3E2723,
                roughness: 0.6,
                metalness: 0.1
            });
            const leftDoor = new THREE.Mesh(leftDoorGeo, doorMat);
            leftDoor.position.x = 0.95; // Adjusted for new width
            leftDoor.castShadow = true;
            leftDoor.userData.clickable = true;
            leftDoor.userData.type = 'door';
            leftDoorPanel.add(leftDoor);

            // Left handle
            const handleGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.4, 12);
            const handleMat = new THREE.MeshStandardMaterial({
                color: 0xFFD700,
                roughness: 0.2,
                metalness: 0.9
            });
            const leftHandle = new THREE.Mesh(handleGeo, handleMat);
            leftHandle.rotation.z = Math.PI / 2;
            leftHandle.position.set(1.5, 0, 0.12); // Adjusted for new width
            leftDoorPanel.add(leftHandle);

            // Right door panel - pivot on RIGHT edge for outward opening
            rightDoorPanel = new THREE.Group();
            rightDoorPanel.position.set(2.4, 2.5, 0.1); // Moved right to create gap

            const rightDoor = new THREE.Mesh(leftDoorGeo, doorMat);
            rightDoor.position.x = -0.95; // Adjusted for new width
            rightDoor.castShadow = true;
            rightDoor.userData.clickable = true;

        function createCorridorScene() {
            console.log('Creating baroque corridor...');

            const corridorLength = 30; // Corridor extends 30m in -Z direction

            const corridorHeight = 6; // Ceiling height

            const wallMat = new THREE.MeshStandardMaterial({
                color: 0xE8DCC0,

            scene.add(floor);

            // Ceiling - same dimensions and position as floor

                color: 0xE8D4B8,
                roughness: 0.9,
                metalness: 0,
                side: THREE.DoubleSide
            });
            const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.set(0, corridorHeight, -corridorLength / 2); // Center at z=-15

            corridorGroup.push(ceiling);
            scene.add(ceiling);

            // Left wall - extends from z=0 to z=-30
            const leftWallGeo = new THREE.PlaneGeometry(corridorLength, corridorHeight);
            const leftWall = new THREE.Mesh(leftWallGeo, wallMat);
            leftWall.rotation.y = Math.PI / 2;
            leftWall.position.set(-corridorWidth / 2, corridorHeight / 2, -corridorLength / 2);
            leftWall.receiveShadow = true;
            leftWall.userData.clickable = true;
            leftWall.userData.type = 'wall';
            leftWall.userData.side = 'left';
            leftWall.visible = false;
            corridorGroup.push(leftWall);
            scene.add(leftWall);

            // Right wall - extends from z=0 to z=-30
            const rightWallGeo = new THREE.PlaneGeometry(corridorLength, corridorHeight);
            const rightWall = new THREE.Mesh(rightWallGeo, wallMat);
            rightWall.rotation.y = -Math.PI / 2;
            rightWall.position.set(corridorWidth / 2, corridorHeight / 2, -corridorLength / 2);
            rightWall.receiveShadow = true;
            rightWall.userData.clickable = true;
            rightWall.userData.type = 'wall';
            rightWall.userData.side = 'right';
            rightWall.visible = false;
            corridorGroup.push(rightWall);
            scene.add(rightWall);

            // Back wall - at far end (z = -30)
            const backWallGeo = new THREE.PlaneGeometry(corridorWidth, corridorHeight);
            const backWall = new THREE.Mesh(backWallGeo, wallMat);
            backWall.rotation.y = Math.PI;
            backWall.position.set(0, corridorHeight / 2, -corridorLength);
            backWall.receiveShadow = true;
            backWall.visible = false;

            // NO FRONT WALL - leave entrance open for clear view down corridor

        function createChandelier(x, y, z) {
            const chandelierGroup = new THREE.Group();
            chandelierGroup.position.set(x, y, z);
            chandelierGroup.visible = false;

            const baseGeo = new THREE.CylinderGeometry(0.3, 0.4, 0.2, 12);
            const goldMat = new THREE.MeshStandardMaterial({
                color: 0xFFD700,
                roughness: 0.2,
                metalness: 0.9
            });
            const base = new THREE.Mesh(baseGeo, goldMat);
            chandelierGroup.add(base);

            const crystalMat = new THREE.MeshStandardMaterial({
                color: 0xFFFFFF,
                roughness: 0.1,
                metalness: 0.3,
                transparent: true,
                opacity: 0.9
            });

            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const radius = 0.5;
                const crystalGeo = new THREE.ConeGeometry(0.05, 0.3, 6);
                const crystal = new THREE.Mesh(crystalGeo, crystalMat);
                crystal.position.set(
                    Math.cos(angle) * radius,
                    -0.3,
                    Math.sin(angle) * radius
                );
                crystal.rotation.x = Math.PI;
                chandelierGroup.add(crystal);
            }

            corridorGroup.push(chandelierGroup);
            scene.add(chandelierGroup);
        }

                scene.add(midMolding);

                const baseMolding = new THREE.Mesh(topMoldingGeo, goldMat);
                baseMolding.position.set(side * (corridorWidth / 2), 0.5, 0);
                baseMolding.visible = false;
                corridorGroup.push(baseMolding);

        function createWallPaintings(side, xPos, storageArray) {
            const artworks = ARTWORKS[side];
            const rotation = side === 'left' ? Math.PI / 2 : -Math.PI / 2;

            // Evenly space 3 paintings along the wall
            // Corridor extends from z=0 to z=-30
            // Place paintings at z = -5, -10, -15 (evenly spaced, clearly visible)
            const paintingZPositions = [-5, -10, -15];

            artworks.forEach((artwork, i) => {
                const zPos = paintingZPositions[i];

                const paintingGroup = new THREE.Group();
                paintingGroup.position.set(xPos, 2.5, zPos); // Height 2.5 (middle of 6-tall wall)
                paintingGroup.rotation.y = rotation;
                paintingGroup.visible = false;
                paintingGroup.userData.clickable = true;
                paintingGroup.userData.type = 'painting';
                paintingGroup.userData.data = artwork;
                paintingGroup.userData.side = side;

                // Canvas
                const canvasGeo = new THREE.PlaneGeometry(2.2, 2.2);
                const canvasMat = new THREE.MeshStandardMaterial({
                    color: artwork.color,
                    roughness: 0.7,
                    metalness: 0
                });
                const canvas = new THREE.Mesh(canvasGeo, canvasMat);
                canvas.position.z = 0.03;
                paintingGroup.add(canvas);

                // Glass
                const glassGeo = new THREE.PlaneGeometry(2.3, 2.3);
                const glassMat = new THREE.MeshStandardMaterial({
                    color: 0xFFFFFF,
                    transparent: true,
                    opacity: 0.08,
                    roughness: 0.05,
                    metalness: 0.2
                });
                const glass = new THREE.Mesh(glassGeo, glassMat);
                glass.position.z = 0.08;
                paintingGroup.add(glass);

                // Gold frame
                const frameColor = 0xD4AF37;
                const frameMat = new THREE.MeshStandardMaterial({
                    color: frameColor,
                    roughness: 0.3,
                    metalness: 0.8
                });

                const frameThick = 0.12;
                const frameDepth = 0.15;

                const topFrame = new THREE.Mesh(
                    new THREE.BoxGeometry(2.5, frameThick, frameDepth),
                    frameMat
                );
                topFrame.position.y = 1.19;
                paintingGroup.add(topFrame);

                const bottomFrame = new THREE.Mesh(
                    new THREE.BoxGeometry(2.5, frameThick, frameDepth),
                    frameMat
                );
                bottomFrame.position.y = -1.19;
                paintingGroup.add(bottomFrame);

                const leftFrame = new THREE.Mesh(
                    new THREE.BoxGeometry(frameThick, 2.26, frameDepth),
                    frameMat
                );
                leftFrame.position.x = -1.19;
                paintingGroup.add(leftFrame);

                const rightFrame = new THREE.Mesh(
                    new THREE.BoxGeometry(frameThick, 2.26, frameDepth),
                    frameMat
                );
                rightFrame.position.x = 1.19;
                paintingGroup.add(rightFrame);

                // Plaque
                const plaqueGeo = new THREE.BoxGeometry(1.0, 0.15, 0.03);
                const plaqueMat = new THREE.MeshStandardMaterial({
                    color: 0xB8860B,
                    roughness: 0.3,
                    metalness: 0.8

                const plaque = new THREE.Mesh(plaqueGeo, plaqueMat);
                plaque.position.set(0, -1.45, 0.08);
                paintingGroup.add(plaque);

                // Lighting
                const washLight = new THREE.SpotLight(0xFFF4E0, 0.8, 6, Math.PI / 8, 0.5);
                washLight.position.copy(paintingGroup.position);
                washLight.position.y += 1.8;
                washLight.position.z += (side === 'left' ? -0.2 : 0.2);
                washLight.target.position.copy(paintingGroup.position);
                washLight.visible = false;
                washLight.castShadow = true;
                corridorGroup.push(washLight);
                corridorGroup.push(washLight.target);
                scene.add(washLight);
                scene.add(washLight.target);

                storageArray.push(paintingGroup);
                corridorGroup.push(paintingGroup);
                scene.add(paintingGroup);
            });

            console.log(`✅ Created ${artworks.length} paintings on ${side} wall`);
        }

        function enterMuseum() {
            if (isAnimating) return;
            isAnimating = true;
            console.log('🚶 Entering museum...');

            // Animate doors opening OUTWARD
            const duration = 1500;
            const startTime = Date.now();

            function animateDoorOpen() {
                const elapsed = Date.now() - startTime;
                const t = Math.min(elapsed / duration, 1);
                const eased = easeInOutCubic(t);

                leftDoorPanel.rotation.y = -eased * (Math.PI / 2.5);
                rightDoorPanel.rotation.y = eased * (Math.PI / 2.5);

                if (t < 1) {
                    requestAnimationFrame(animateDoorOpen);
                } else {
                    createWhiteLightTransition();
                }
            }

            animateDoorOpen();
        }

        function createWhiteLightTransition() {
            // White overlay for portal effect
            const whiteFade = document.createElement('div');
            whiteFade.style.position = 'fixed';
            whiteFade.style.top = '0';
            whiteFade.style.left = '0';
            whiteFade.style.width = '100%';
            whiteFade.style.height = '100%';
            whiteFade.style.background = 'radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,255,255,0.95) 100%)';
            whiteFade.style.opacity = '0';
            whiteFade.style.transition = 'opacity 0.8s ease-in';
            whiteFade.style.zIndex = '999';
            whiteFade.style.pointerEvents = 'none';
            document.body.appendChild(whiteFade);

            setTimeout(() => {
                whiteFade.style.opacity = '1';
            }, 50);

            setTimeout(() => {
                entranceDoor.visible = false;
                scene.background = new THREE.Color(0xFAF8F3);
                scene.fog = new THREE.Fog(0xFAF8F3, 15, 35); // Adjusted for 30m corridor
                corridorGroup.forEach(obj => obj.visible = true);

                camera.position.set(0, 1.7, -2); // Near entrance, looking down corridor
                camera.rotation.set(0, 0, 0);
                camera.lookAt(0, 2, -15); // Look toward far end of corridor
            }, 800);

            setTimeout(() => {
                whiteFade.style.transition = 'opacity 1s ease-out';
                whiteFade.style.opacity = '0';
            }, 1000);

            setTimeout(() => {
                document.body.removeChild(whiteFade);
                currentView = 'CORRIDOR';
                isAnimating = false;
                backBtn.classList.add('hidden'); // Hide exit button
                wallHintLeft.classList.remove('hidden');
                wallHintRight.classList.remove('hidden');
                console.log('✅ Inside corridor');
            }, 2000);
        }

        function viewWall(side) {
            if (isAnimating) return;
            isAnimating = true;
            console.log(`👁️ Viewing ${side} wall...`);

            wallHintLeft.classList.add('hidden');
            wallHintRight.classList.add('hidden');

            // Position camera in middle of corridor, facing the wall
            // Paintings are at z = -5, -10, -15, so center at z = -10
            // Camera stays in center of room width, clear view of wall
            const targetAngle = side === 'left' ? Math.PI / 2 : -Math.PI / 2;
            const targetPos = new THREE.Vector3(0, 2, -10); // Middle of corridor, painting height

            animateCamera(
                camera.position.clone(),
                targetPos,
                camera.rotation.clone(),
                new THREE.Euler(0, targetAngle, 0),
                1200, // Slower transition for smoothness
                () => {
                    currentView = side === 'left' ? 'WALL_LEFT' : 'WALL_RIGHT';
                    isAnimating = false;
                    backBtn.classList.remove('hidden');
                    backText.textContent = 'Back to Corridor';
                    console.log(`✅ Viewing ${side} wall - all 3 paintings visible`);
                }
            );
        }

            whiteFade.style.background = 'radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,255,255,0.95) 100%)';
            whiteFade.style.opacity = '0';
            whiteFade.style.transition = 'opacity 0.6s ease-in';
            whiteFade.style.zIndex = '2999';
            whiteFade.style.pointerEvents = 'none';
            document.body.appendChild(whiteFade);

            setTimeout(() => {
                whiteFade.style.opacity = '1';
            }, 50);

            setTimeout(() => {
                // Hide the detail overlay
                detailOverlay.classList.remove('active');

                // Show canvas again
                renderer.domElement.style.display = 'block';

                // Restore gallery scene
                scene.background = new THREE.Color(0xFAF8F3);
                scene.fog = new THREE.Fog(0xFAF8F3, 15, 35);
                renderer.setClearColor(0xFAF8F3, 1);

                // Show corridor objects again
                corridorGroup.forEach(obj => obj.visible = true);

                const targetAngle = side === 'left' ? Math.PI / 2 : -Math.PI / 2;
                const targetPos = new THREE.Vector3(0, 2, -10);

                // Snap camera back to wall view instantly
                camera.position.copy(targetPos);
                camera.rotation.set(0, targetAngle, 0);

                currentView = side === 'left' ? 'WALL_LEFT' : 'WALL_RIGHT';
                selectedPainting = null;

                // Keep back button visible and update text
                backBtn.classList.remove('hidden');
                backText.textContent = 'Back to Corridor';

                console.log(`✅ Returned to ${side} wall view`);

                // Fade out white overlay
                whiteFade.style.transition = 'opacity 0.6s ease-out';
                whiteFade.style.opacity = '0';

                setTimeout(() => {
                    document.body.removeChild(whiteFade);
                }, 600);
            }, 600);
        }

        function goBack() {
            if (isAnimating) return;
            console.log('⬅️ Going back...');

            if (currentView === 'DETAIL') {
                // Use the new closeDetailOverlay function
                closeDetailOverlay();

            } else if (currentView === 'WALL_LEFT' || currentView === 'WALL_RIGHT') {
                isAnimating = true;
                animateCamera(
                    camera.position.clone(),
                    new THREE.Vector3(0, 1.7, -2), // Return to entrance position
                    camera.rotation.clone(),
                    new THREE.Euler(0, 0, 0),
                    800,
                    () => {
                        currentView = 'CORRIDOR';
                        isAnimating = false;
                        backBtn.classList.add('hidden'); // Hide exit button
                        wallHintLeft.classList.remove('hidden');
                        wallHintRight.classList.remove('hidden');
                        camera.lookAt(0, 2, -15); // Look down corridor
                    }
                );

            }
            // Removed: No exit from corridor - user stays in museum
        }

        // ============================================
        // CAMERA ANIMATION
        // ============================================

        function animateCamera(fromPos, toPos, fromRot, toRot, duration, callback) {
            const startTime = Date.now();
            const startPos = fromPos.clone();
            const startRot = fromRot.clone();

            function updateCamera() {
                const elapsed = Date.now() - startTime;
                const t = Math.min(elapsed / duration, 1);
                const eased = easeInOutCubic(t);

                camera.position.lerpVectors(startPos, toPos, eased);
                camera.rotation.x = THREE.MathUtils.lerp(startRot.x, toRot.x, eased);
                camera.rotation.y = THREE.MathUtils.lerp(startRot.y, toRot.y, eased);
                camera.rotation.z = THREE.MathUtils.lerp(startRot.z, toRot.z, eased);

                if (t < 1) {
                    requestAnimationFrame(updateCamera);
                } else {
                    if (callback) callback();
                }
            }

            updateCamera();
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        // ============================================
        // RENDER LOOP
        // ============================================

        function animate() {
            requestAnimationFrame(animate);

            if (hoveredPainting && (currentView === 'WALL_LEFT' || currentView === 'WALL_RIGHT')) {
                const targetScale = 1.05;
                hoveredPainting.scale.setScalar(
                    THREE.MathUtils.lerp(hoveredPainting.scale.x, targetScale, 0.08)
                );
            }

            const allPaintings = [...leftWallPaintings, ...rightWallPaintings];
            allPaintings.forEach(painting => {
                if (painting !== hoveredPainting && painting.scale.x > 1.001) {
                    painting.scale.setScalar(
                        THREE.MathUtils.lerp(painting.scale.x, 1, 0.08)
                    );
                }
            });

            renderer.render(scene, camera);
        }

        // ============================================
        // EVENT HANDLERS
        // ============================================

        function onMouseMove(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            // Skip interactions when in detail overlay (pure 2D mode)
            if (currentView === 'DETAIL') {
                return;
            }

            // Hover detection
            if (!isDragging && !isAnimating) {
                raycaster.setFromCamera(mouse, camera);
                let cursor = 'default';
                let foundHover = null;

                if (currentView === 'ENTRANCE') {
                    const hits = raycaster.intersectObject(entranceDoor, true);
                    if (hits.length > 0) cursor = 'pointer';

                } else if (currentView === 'CORRIDOR') {
                    const hits = raycaster.intersectObjects(scene.children, true);
                    for (const hit of hits) {
                        if (hit.object.userData.clickable && hit.object.userData.type === 'wall') {
                            cursor = 'pointer';
                            break;
                        }
                    }

                } else if (currentView === 'WALL_LEFT' || currentView === 'WALL_RIGHT') {
                    const hits = raycaster.intersectObjects(scene.children, true);
                    for (const hit of hits) {
                        let obj = hit.object;
                        while (obj.parent && !obj.userData.clickable) obj = obj.parent;
                        if (obj.userData.type === 'painting') {
                            cursor = 'pointer';
                            foundHover = obj;
                            break;
                        }
                    }
                }

                hoveredPainting = foundHover;
                renderer.domElement.style.cursor = cursor;
            }
        }

        function onClick(event) {
            if (isAnimating) return;

            raycaster.setFromCamera(mouse, camera);

            if (currentView === 'ENTRANCE') {
                const hits = raycaster.intersectObject(entranceDoor, true);
                if (hits.length > 0) {
                    console.log('🚪 Door clicked');
                    enterMuseum();
                }

            } else if (currentView === 'CORRIDOR') {
                const hits = raycaster.intersectObjects(scene.children, true);
                for (const hit of hits) {
                    if (hit.object.userData.clickable && hit.object.userData.type === 'wall') {
                        console.log(`🖼️ ${hit.object.userData.side} wall clicked`);
                        viewWall(hit.object.userData.side);
                        break;
                    }
                }

            } else if (currentView === 'WALL_LEFT' || currentView === 'WALL_RIGHT') {
                const hits = raycaster.intersectObjects(scene.children, true);
                for (const hit of hits) {
                    let obj = hit.object;
                    while (obj.parent && !obj.userData.clickable) obj = obj.parent;
                    if (obj.userData.type === 'painting') {
                        viewArtworkDetail(obj.userData.data);
                        break;
                    }
                }
            }
        }

        function onMouseDown(event) {
            // No mouse interactions needed in detail overlay (pure 2D mode)
        }

        function onMouseUp(event) {
            // No mouse interactions needed in detail overlay (pure 2D mode)
        }

        function onMouseLeave(event) {
            // No mouse interactions needed in detail overlay (pure 2D mode)
        }

        function onWheel(event) {
            // No wheel zoom needed in detail overlay (pure 2D mode)
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ============================================
        // UI FUNCTIONS
        // ============================================

        function showArtworkInfo(data) {
            document.getElementById('artwork-title').textContent = data.title;
            document.getElementById('artwork-artist').textContent = data.artist;
            document.getElementById('artwork-year').textContent = data.year;
            document.getElementById('artwork-medium').textContent = data.medium;
            document.getElementById('artwork-description').textContent = data.description;
            infoPanel.classList.remove('hidden');
        }

        function hideArtworkInfo() {
            infoPanel.classList.add('hidden');
        }

        // ============================================
        // START APPLICATION
        // ============================================

        init();
    </script>
</body>
</html>
